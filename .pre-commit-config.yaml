# The sibling repo ran its record rules on the honour system for months and they
# drifted badly. These hooks are the reason that does not repeat here.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      # Hard-fails on a dangling RESEARCH_LOG.md#Lnnnn link or a stale generated
      # doc. Runs on every commit because a broken link is cheapest to fix at the
      # commit that broke it.
      - id: doc-audit
        name: research-record integrity
        entry: uv run python tools/doc_audit.py
        language: system
        pass_filenames: false
        files: '\.md$'

      # PROJECT.md 12: no citation without a resolving DOI/venue. This is that
      # rule as a check rather than a promise.
      - id: lit-check
        name: literature index is current
        entry: uv run python research/lit_table.py --check
        language: system
        pass_filenames: false
        files: '^literature/'
